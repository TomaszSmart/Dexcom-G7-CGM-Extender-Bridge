<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>G7 Bridge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one narrow column of instrument panels — reading first, then the sensor, then setup. */
:root {
  --bg: #eef2f4;
  --panel: #ffffff;
  --ink: #15212b;
  --muted: #5b6b77;
  --line: #d5dde3;
  --accent: #0b6e80;
  --accent-ink: #ffffff;
  --low: #c0392b;
  --ok: #1f8a4c;
  --high: #b7791f;
  --soft: #e3eef1;
  --font-display: "Sora", "Segoe UI", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f171d; --panel: #16222b; --ink: #e6eef2; --muted: #93a6b3; --line: #273742;
    --accent: #3fb4c7; --accent-ink: #062027; --low: #ff6b5c; --ok: #46c77e; --high: #e6ad4a;
    --soft: #1c2d37; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f171d; --panel: #16222b; --ink: #e6eef2; --muted: #93a6b3; --line: #273742;
  --accent: #3fb4c7; --accent-ink: #062027; --low: #ff6b5c; --ok: #46c77e; --high: #e6ad4a;
  --soft: #1c2d37; color-scheme: dark;
}
* { box-sizing: border-box; }
html { padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px); background: var(--bg); }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 400 15px/1.5 var(--font-body);
}
main { max-width: 34rem; margin: 0 auto; padding-inline: 16px; padding-block: 20px 40px; display: grid; gap: 14px; }
header { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.head-left { display: grid; gap: 4px; }
.head-right { display: inline-flex; align-items: center; gap: 12px; }
.head-sub { flex-basis: 100%; display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
/* Bridge battery like a phone's: the fill shrinks and changes colour; a bolt while charging. */
.batt { position: relative; display: inline-block; width: 60px; height: 30px; padding: 3px;
  border: 2px solid var(--muted); border-radius: 8px; }
.batt[hidden] { display: none; }
.batt::after { content: ""; position: absolute; right: -6px; top: 8px; width: 3px; height: 10px;
  background: var(--muted); border-radius: 0 2px 2px 0; }
.batt-fill { display: block; height: 100%; width: 0; border-radius: 3px; background: var(--ok); }
.batt-txt { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  font: 700 0.85rem var(--font-body); color: var(--ink); }
.batt-txt svg { width: 12px; height: 18px; fill: var(--ink); }
h1 { font: 700 1.35rem/1.2 var(--font-display); margin: 0; letter-spacing: -0.01em; }
h2 { font: 600 0.78rem/1.2 var(--font-body); margin: 0 0 10px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px; min-width: 0; }
.conn { display: inline-flex; align-items: center; gap: 8px; font-size: 0.85rem; color: var(--muted); }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--line); }
.dot.on { background: var(--ok); }
button {
  font: 600 0.95rem var(--font-body); border-radius: 9px; border: 1px solid var(--accent);
  background: var(--accent); color: var(--accent-ink); padding: 10px 16px; cursor: pointer;
}
button.quiet { background: transparent; color: var(--accent); }
button.danger { border-color: var(--low); background: transparent; color: var(--low); }
button:disabled { opacity: 0.45; cursor: default; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.lang { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.lang button {
  font: 600 0.75rem var(--font-body); letter-spacing: 0.05em; padding: 4px 9px; border: 0; border-radius: 0;
  background: transparent; color: var(--muted);
}
.lang button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }

.reading { display: grid; grid-template-columns: auto 1fr; gap: 4px 18px; align-items: end; }
.bg { font: 700 3.6rem/0.95 var(--font-display); font-variant-numeric: tabular-nums; letter-spacing: -0.03em; }
.bg small { font: 500 0.95rem var(--font-body); color: var(--muted); margin-left: 4px; letter-spacing: 0; }
.bg.low { color: var(--low); } .bg.ok { color: var(--ok); } .bg.high { color: var(--high); } .bg.none { color: var(--muted); }
.trend { font: 500 1.05rem var(--font-body); }
.sub { color: var(--muted); font-size: 0.88rem; }
ol.sub { padding-left: 20px; margin: 8px 0; }
ol.sub li { margin: 4px 0; }
code { font-size: 0.85em; overflow-wrap: anywhere; user-select: all; }
.pill { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 0.8rem; font-weight: 600; background: var(--soft); color: var(--ink); }
.pill.bad { background: color-mix(in srgb, var(--low) 16%, transparent); color: var(--low); }
.pill.good { background: color-mix(in srgb, var(--ok) 16%, transparent); color: var(--ok); }
.pill.warn { background: color-mix(in srgb, var(--high) 18%, transparent); color: var(--high); }

dl { display: grid; grid-template-columns: max-content 1fr; gap: 6px 14px; margin: 0; }
dt { color: var(--muted); font-size: 0.88rem; }
dd { margin: 0; font-variant-numeric: tabular-nums; min-width: 0; }
.bar { height: 8px; border-radius: 4px; background: var(--soft); overflow: hidden; margin-top: 12px; }
.bar > span { display: block; height: 100%; background: var(--accent); width: 0; }

form.pair { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; }
label { display: grid; gap: 4px; font-size: 0.85rem; color: var(--muted); }
input#code {
  font: 500 1.6rem/1 var(--font-mono); letter-spacing: 0.35em; width: 8.2em; padding: 8px 10px;
  border-radius: 9px; border: 1px solid var(--line); background: var(--bg); color: var(--ink);
}
.search { margin-top: 10px; font-size: 0.9rem; }
ul.seen { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
ul.seen li { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; align-items: center; padding-block: 8px; border-top: 1px solid var(--line); }
ul.seen li:first-child { border-top: 0; }
.name { font: 500 1rem var(--font-mono); }
.rssi { display: inline-flex; gap: 2px; align-items: flex-end; height: 14px; margin-left: 8px; vertical-align: -2px; }
.rssi i { width: 4px; background: var(--line); border-radius: 1px; }
.rssi i.on { background: var(--accent); }
.msg { font-size: 0.88rem; color: var(--muted); min-height: 1.3em; }
.msg:empty { min-height: 0; margin-block: -7px !important; } /* no gap under the header without a message */
.confirm { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 10px; }
details summary { cursor: pointer; color: var(--muted); font-size: 0.9rem; }
.nobt { border-color: var(--low); }
#camVideo { width: 100%; max-height: 60vh; margin-top: 10px; border-radius: 9px; background: #000; object-fit: cover; }
@media (prefers-reduced-motion: no-preference) { .bar > span { transition: width 0.4s ease; } }
</style>
</head>
<body>
<main>
  <header>
    <div class="head-left">
      <h1>G7 Bridge</h1>
      <span class="conn"><span class="dot" id="dot"></span><span id="connText" data-i18n="connNo"></span></span>
    </div>
    <div class="head-right">
      <span class="batt" id="batt" role="img" hidden><span class="batt-fill" id="battFill"></span><span class="batt-txt" id="battTxt"></span></span>
      <button type="button" id="connectBtn"></button>
    </div>
    <div class="head-sub">
      <span class="sub"><span data-i18n="fwLabel"></span> <span id="fwVer">—</span></span>
      <span class="lang" role="group" aria-label="Language / Język">
        <button type="button" data-lang="en" aria-pressed="true">EN</button>
        <button type="button" data-lang="pl" aria-pressed="false">PL</button>
      </span>
    </div>
  </header>
  <p class="msg" id="msg" role="status" style="margin:0"></p>

  <section class="panel nobt" id="noBt" hidden>
    <h2 data-i18n="noBtTitle"></h2>
    <p class="sub" data-i18n="noBtText"></p>
  </section>

  <section class="panel" aria-labelledby="hReading">
    <h2 id="hReading" data-i18n="hReading"></h2>
    <div class="reading">
      <div class="bg none" id="bg">—<small>mg/dL</small></div>
      <div>
        <div class="trend" id="trend" data-i18n="trendInit"></div>
        <div class="sub" id="age"></div>
      </div>
    </div>
    <div style="margin-top:10px"><span class="pill" id="state" data-i18n="stateNone"></span></div>
  </section>

  <section class="panel" aria-labelledby="hRange">
    <h2 id="hRange" data-i18n="hRange"></h2>
    <dl>
      <dt data-i18n="pRssi"></dt><dd><span id="pRssi">—</span></dd>
      <dt data-i18n="sRssi"></dt><dd><span id="sRssi">—</span></dd>
    </dl>
    <p class="sub" data-i18n="rangeHint"></p>
  </section>

  <section class="panel" aria-labelledby="hSensor">
    <h2 id="hSensor" data-i18n="hSensor"></h2>
    <dl>
      <dt data-i18n="sName"></dt><dd id="sName">—</dd>
      <dt data-i18n="sDay"></dt><dd id="sDay">—</dd>
      <dt data-i18n="sEnd"></dt><dd id="sEnd">—</dd>
      <dt data-i18n="sCode"></dt><dd id="sCode">—</dd>
      <dt data-i18n="sPhone"></dt><dd id="sPhone">—</dd>
    </dl>
    <div class="bar" aria-hidden="true"><span id="sBar"></span></div>
  </section>

  <section class="panel" aria-labelledby="hPair">
    <h2 id="hPair" data-i18n="hPair"></h2>
    <form class="pair" id="pairForm">
      <label for="code"><span data-i18n="codeLabel"></span>
        <input id="code" inputmode="numeric" autocomplete="off" pattern="[0-9]{4}([0-9]{2})?" maxlength="6" placeholder="0000" required>
      </label>
      <button type="submit" id="pairBtn" disabled data-i18n="pairBtn"></button>
    </form>
    <p class="sub" data-i18n="pairHint"></p>
    <div class="search" id="search" hidden></div>
    <h2 id="hSeen" data-i18n="hSeen" style="margin-top:18px"></h2>
    <ul class="seen" id="seen">
      <li><span class="sub" data-i18n="seenInit"></span></li>
    </ul>
  </section>

  <!-- The bridge's answer to a command sent from this page (code, G7 configuration, unpairing) -->
  <p class="msg" id="bridgeMsg" role="status" style="margin:0"></p>

  <section class="panel" aria-labelledby="hCerts">
    <h2 id="hCerts" data-i18n="hCerts"></h2>
    <dl><dt data-i18n="certsState"></dt><dd id="certsState">—</dd></dl>
    <details id="certsBox">
      <summary data-i18n="certsLoad"></summary>
      <details>
        <summary data-i18n="certsWhat"></summary>
        <p class="sub" data-i18n="certsHint"></p>
      </details>
      <div class="confirm">
        <button type="button" id="certsDocBtn" data-i18n="certsDoc"></button>
        <button type="button" class="quiet" id="camBtn" data-i18n="camStart"></button>
      </div>
      <div id="camBox" hidden>
        <video id="camVideo" playsinline muted></video>
        <p class="sub" data-i18n="camHint"></p>
      </div>
      <textarea id="certsText" hidden></textarea>
      <div class="confirm">
        <button type="button" id="certsBtn" disabled data-i18n="certsSend"></button>
      </div>
      <p class="sub" id="certsMsg" role="status"></p>
    </details>
  </section>

  <section class="panel">
    <details id="xdripHelp">
      <summary data-i18n="xdTitle"></summary>
      <ol class="sub">
        <li data-i18n="xd1"></li>
        <li data-i18n-html="xd2"></li>
        <li data-i18n="xd3"></li>
        <li data-i18n="xd4"></li>
        <li data-i18n="xd5"></li>
      </ol>
    </details>
    <details>
      <summary data-i18n="ledTitle"></summary>
      <dl style="margin-top:10px">
        <dt data-i18n="ledG1"></dt><dd data-i18n="ledG1d"></dd>
        <dt data-i18n="ledG2"></dt><dd data-i18n="ledG2d"></dd>
        <dt data-i18n="ledGB3"></dt><dd data-i18n="ledGB3d"></dd>
        <dt data-i18n="ledGB1"></dt><dd data-i18n="ledGB1d"></dd>
        <dt data-i18n="ledBb"></dt><dd data-i18n="ledBbd"></dd>
        <dt data-i18n="ledB5"></dt><dd data-i18n="ledB5d"></dd>
        <dt data-i18n="ledR"></dt><dd data-i18n="ledRd"></dd>
      </dl>
    </details>
    <details id="autoHelp">
      <summary data-i18n="autoTitle"></summary>
      <p class="sub" data-i18n="autoP1"></p>
      <ol class="sub">
        <li data-i18n-html="autoL1"></li>
        <li data-i18n-html="autoL2"></li>
        <li data-i18n-html="autoL3"></li>
        <li data-i18n="autoL4"></li>
      </ol>
      <p class="sub" data-i18n="autoP2"></p>
    </details>
    <details>
      <summary data-i18n="unpTitle"></summary>
      <p class="sub" data-i18n="unpText"></p>
      <div class="confirm">
        <button type="button" class="danger" id="unpairBtn" disabled data-i18n="unpBtn"></button>
        <span id="unpairConfirm" hidden>
          <button type="button" class="danger" id="unpairYes" data-i18n="unpYes"></button>
          <button type="button" class="quiet" id="unpairNo" data-i18n="unpNo"></button>
        </span>
      </div>
    </details>
  </section>

  <section class="panel" aria-labelledby="hAbout">
    <h2 id="hAbout" data-i18n="hAbout"></h2>
    <p class="sub" data-i18n="about1"></p>
    <p class="sub" data-i18n="about2"></p>
    <p class="sub" data-i18n="about3"></p>
  </section>
  <p class="sub" style="margin:0;text-align:center"><span data-i18n="appLine"></span>
    <a id="apkLink" href="https://github.com/TomaszSmart/Dexcom-G7-CGM-Extender-Bridge/releases"></a> ·
    <a id="apkHow" target="_blank" rel="noopener"></a></p>
</main>

// ---- app certificates (xDrip+'s keks_p1..p3) --------------------------------------
const hexToBytes = (h) => {
  const s = h.replace(/[^0-9a-f]/gi, ''); // like xDrip's tolerantHexStringToByteArray
  return Uint8Array.from(s.match(/../g) || [], (b) => parseInt(b, 16));
};

// xDrip+ QRcodeUtils "xdp2:" format: base64 -> gzip -> u16 count, then
// (u16 key length, key, u16 value length, value) big-endian; "b__" keys hold raw bytes.
async function decodeXdp2(text) {
  const b64 = text.replace(/^xdp2:/, '').replace(/\s+/g, '').replace(/-/g, '+').replace(/_/g, '/');
  const raw = Uint8Array.from(atob(b64 + '='.repeat((4 - b64.length % 4) % 4)), (c) => c.charCodeAt(0));
  const gz = new Blob([raw]).stream().pipeThrough(new DecompressionStream('gzip'));
  const buf = new Uint8Array(await new Response(gz).arrayBuffer());
  const dv = new DataView(buf.buffer);
  const out = {};
  let off = 2;
  for (let i = 0, n = dv.getUint16(0); i < n; i++) {
    const kl = dv.getUint16(off); off += 2;
    const key = new TextDecoder().decode(buf.subarray(off, off + kl)).replace(/^b__/, ''); off += kl;
    const vl = dv.getUint16(off); off += 2;
    out[key] = buf.slice(off, off + vl); off += vl;
  }
  return out;
}

async function parseCerts(text) {
  text = text.trim();
  let parts = {};
  if (text.startsWith('xdp2:')) {
    parts = await decodeXdp2(text);
  } else if (text.startsWith('<')) {
    const doc = new DOMParser().parseFromString(text, 'text/xml');
    for (const el of doc.querySelectorAll('string')) {
      if (/^keks_p[123]$/.test(el.getAttribute('name'))) parts[el.getAttribute('name')] = hexToBytes(el.textContent);
    }
  } else {
    for (const m of text.matchAll(/(keks_p[123])\s*[=:]\s*([0-9A-Fa-f\s:]+)/g)) parts[m[1]] = hexToBytes(m[2]);
  }
  const [a, b, k] = ['keks_p1', 'keks_p2', 'keks_p3'].map((n) => parts[n]);
  if (!a || !b || !k || !k.length) throw new Error(t('certsMissing'));
  if (a.length <= 100 || b.length <= 100) throw new Error(t('certsShort'));
  return [a, b, k];
}

async function sendCerts() {
  const msg = $('certsMsg');
  let parts;
  try {
    parts = await parseCerts($('certsText').value);
  } catch (e) {
    msg.textContent = t('certsBad', e.message);
    return;
  }
  $('certsBtn').disabled = true;
  try {
    const total = parts.reduce((n, p) => n + p.length, 0);
    let sent = 0;
    for (let i = 0; i < parts.length; i++) {
      // <part 1..3> <offset u16 LE> <up to 16 bytes>: fits the default 20-byte write
      for (let off = 0; off < parts[i].length; off += 16) {
        const chunk = parts[i].subarray(off, off + 16);
        const pkt = new Uint8Array(3 + chunk.length);
        pkt.set([i + 1, off & 0xff, off >> 8]);
        pkt.set(chunk, 3);
        await certsChr.writeValueWithResponse(pkt);
        sent += chunk.length;
        msg.textContent = t('certsSending', Math.round(100 * sent / total));
      }
    }
    await send('certs_commit');
    msg.textContent = '';
    $('certsText').value = '';
  } catch (e) {
    msg.textContent = t('sendFail') + e.message;
  } finally {
    $('certsBtn').disabled = !certsChr;
  }
}

// QR codes: Chrome's BarcodeDetector where it exists, else jsQR from a CDN.
const detector = 'BarcodeDetector' in window ? new BarcodeDetector({ formats: ['qr_code'] }) : null;

async function loadJsQr() {
  if (window.jsQR) return;
  await new Promise((ok, fail) => {
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js';
    s.onload = ok; s.onerror = fail;
    document.head.append(s);
  });
}

// One attempt on an image/video source, drawn at most `max` pixels wide.
async function decodeQr(src, w, h, max) {
  if (detector) {
    try {
      const codes = await detector.detect(src);
      if (codes.length) return codes[0].rawValue;
    } catch (e) { /* try jsQR */ }
  }
  await loadJsQr();
  const k = Math.min(1, max / Math.max(w, h));
  const c = document.createElement('canvas');
  c.width = Math.round(w * k); c.height = Math.round(h * k);
  const ctx = c.getContext('2d', { willReadFrequently: true });
  ctx.drawImage(src, 0, 0, c.width, c.height);
  const res = jsQR(ctx.getImageData(0, 0, c.width, c.height).data, c.width, c.height);
  return res ? res.data : null;
}

// The QR image from the xDrip+ documentation; a dense QR reads best around 1000 px.
async function readQr(file) {
  const bmp = await createImageBitmap(file);
  for (const max of [1200, 800, 1600, 2400]) {
    const text = await decodeQr(bmp, bmp.width, bmp.height, max);
    if (text) return text;
  }
  return null;
}

// Live scanning with the rear camera.
let camStream = null;

function stopCam() {
  if (camStream) camStream.getTracks().forEach((tr) => tr.stop());
  camStream = null;
  $('camBox').hidden = true;
  $('camBtn').textContent = t('camStart');

async function startCam() {
  const video = $('camVideo');
  try {
    camStream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } },
      audio: false,
    });
  } catch (e) {
    $('certsMsg').textContent = t('camFail') + e.message;
    return;
  }
  video.srcObject = camStream;
  await video.play();
  $('camBox').hidden = false;
  $('camBtn').textContent = t('camStop');
  $('certsMsg').textContent = '';
  while (camStream) {
    if (video.readyState >= 2) {
      const text = await decodeQr(video, video.videoWidth, video.videoHeight, 1000).catch(() => null);
      if (text && camStream) {
        stopCam();
        $('certsText').value = text;
        $('certsMsg').textContent = t('certsQrRead');
        return;
      }
    }
    await new Promise((r) => setTimeout(r, 200));
  }
}

// ---- firmware version vs the latest release ------------------------------------
const REPO = 'TomaszSmart/Dexcom-G7-CGM-Extender-Bridge';
const RELEASES = 'https://github.com/' + REPO + '/releases/latest';
const HOWTO = 'https://github.com/' + REPO + '/blob/main/firmware/README.md#install';
let fwVersion = null, latest = null;

// The highest version with this tag prefix, not the first in the list: releases made in the
// same second come back in any order (app-v0.1.9 was listed before app-v0.1.10).
function newestRelease(all, prefix) {
  const re = new RegExp('^' + prefix + '\\d');
  return all.filter((x) => !x.draft && !x.prerelease && re.test(x.tag_name))
    .map((x) => ({ x, v: verNum(x.tag_name.slice(prefix.length)) || [] }))
    .sort((a, b) => (newer(a.v, b.v) ? -1 : newer(b.v, a.v) ? 1 : 0))
    .map((e) => e.x)[0];
}

// Checked on load, when the tab comes back after 5 min and every 30 min while it stays open.
let releasesChecked = 0;

async function checkReleases() {
  releasesChecked = Date.now();
  try {
    // The repository also has app releases (tags app-v…): only firmware tags (v…) count.
    const r = await fetch('https://api.github.com/repos/' + REPO + '/releases?per_page=30');
    if (!r.ok) return;
    const all = await r.json();
    // The newest Android app release (tags app-v…), for the download link at the top.
    const app = newestRelease(all, 'app-v');
    const apk = app && (app.assets || []).find((a) => /\.apk$/.test(a.name));
    if (apk) {
      appApk = { ver: app.tag_name.replace(/^app-v/, ''), url: apk.browser_download_url };
      renderApk();
    }
    const j = newestRelease(all, 'v');
    if (!j) return;
    const asset = (j.assets || []).find((a) => /rak4631.*\.uf2$/.test(a.name));
    latest = { ver: j.tag_name.replace(/^v/, ''), url: asset ? asset.browser_download_url : RELEASES };
    renderVersion();
  } catch (e) { /* offline: no update check */ }
}

checkReleases();
setInterval(checkReleases, 30 * 60000);
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && Date.now() - releasesChecked > 5 * 60000) checkReleases();
});

  if (appApk) $('apkLink').href = appApk.url;

  $('apkHow').href = 'https://github.com/' + REPO + '/blob/main/android/' + (lang === 'pl' ? 'README.pl.md' : 'README.md');
}

const verNum = (v) => (/^\d+(\.\d+)*$/.test(v) ? v.split('.').map(Number) : null);

function newer(a, b) { // a > b
  for (let i = 0; i < Math.max(a.length, b.length); i++) {
    if ((a[i] || 0) !== (b[i] || 0)) return (a[i] || 0) > (b[i] || 0);
  }
  return false;
}

function renderVersion() {
  const el = $('fwVer');
  if (!fwVersion) { el.textContent = '—'; return; }
  const cur = verNum(fwVersion), lat = latest && verNum(latest.ver);
  let html = esc(fwVersion);
  if (cur && lat && newer(lat, cur)) {
    html += ' <span class="pill warn">' + esc(t('fwNew', latest.ver)) + '</span>' +
      ' <a href="' + latest.url + '">' + t('fwGet') + '</a> · <a href="' + HOWTO + '" target="_blank" rel="noopener">' + t('fwHow') + '</a>';
  } else if (!cur) {
    html += ' <span class="pill">' + t('fwDev') + '</span>';
  } else if (lat) {
    html += ' <span class="pill good">' + t('fwCurrent') + '</span>';
  }
  el.innerHTML = html;
}

// G7 algorithm states (xDrip+ CalibrationState names)
function stateInfo(s) {
  if (s === 0x06) return [t('stOk'), 'good'];
  if (s === 0x07) return [t('stCal'), 'warn'];
  if (s === 0x02) return [t('stWarm'), 'warn'];
  if ([0x01, 0x0f, 0x18, 0x1a, 0xc2].includes(s)) return [t('stEnd'), 'bad'];
  if (s === 0x03) return [t('stNoise'), 'warn'];
  return [t('stFail') + ' (0x' + s.toString(16).padStart(2, '0') + ')', 'bad'];
}

function trendText(tr) {
  if (tr === undefined) return t('trendUnknown');
  const v = tr / 10;
  const arrow = v <= -2 ? '↓↓' : v <= -1 ? '↓' : v < -0.5 ? '↘' : v <= 0.5 ? '→' : v < 1 ? '↗' : v < 2 ? '↑' : '↑↑';
  return arrow + ' ' + (v > 0 ? '+' : '') + num(v, 1) + ' mg/dL/min';
}

function bars(rssi) {
  const n = rssi > -65 ? 3 : rssi > -80 ? 2 : 1;
  return '<span class="rssi" aria-label="' + t('signal') + ' ' + rssi + ' dBm">' +
    [5, 9, 14].map((h, i) => '<i class="' + (i < n ? 'on' : '') + '" style="height:' + h + 'px"></i>').join('') + '</span>';
}

function esc(s) { return String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

function render(st) {
  lastStatus = st;
  const g = st.g;
  const bg = $('bg');
  if (g) {
    const usable = g.state === 0x06 || g.state === 0x07;
    bg.className = 'bg ' + (!usable ? 'none' : g.mgdl < 70 ? 'low' : g.mgdl > 180 ? 'high' : 'ok');
    bg.innerHTML = g.mgdl + '<small>mg/dL</small>';
    $('trend').textContent = usable ? trendText(g.trend) : t('notForwarded');
    $('age').textContent = t('ago', g.age);
    const [label, cls] = stateInfo(g.state);
    $('state').textContent = label;
    $('state').className = 'pill ' + cls;
  } else {
    bg.className = 'bg none';
    bg.innerHTML = '—<small>mg/dL</small>';
    $('trend').textContent = t('noReading');
    $('age').textContent = '';
    $('state').textContent = t('waitSensor');
    $('state').className = 'pill';
  }

  const using = (st.seen || []).find((s) => s.use);
  $('sName').textContent = using ? using.n : (st.id ? 'DXCM' + st.id : t('notSelected'));
  const sess = st.sess || {};
  if (sess.min !== undefined && sess.len) {
    $('sDay').textContent = t('dayOf', Math.floor(sess.min / 1440), Math.floor(sess.len / 1440));
    $('sBar').style.width = Math.min(100, 100 * sess.min / sess.len) + '%';
  } else if (sess.min !== undefined) {
    $('sDay').textContent = t('day', Math.floor(sess.min / 1440));
    $('sBar').style.width = '0%';
  } else {
    $('sDay').textContent = t('sessUnknown');
    $('sBar').style.width = '0%';
  }
  // From the sensor's own clock (no session start from xDrip+ needed). A sensor that did not
  // tell its session length (often one that has ended) gets the G7 standard, marked "~".
  if (sess.min !== undefined) {
    const end = new Date(Date.now() + ((sess.len || G7_SESSION_MIN) - sess.min) * 60000);
    $('sEnd').textContent = (sess.len ? '' : '~ ') + dateFmt.format(end) + (end < new Date() ? t('passed') : '');
  } else {
    $('sEnd').textContent = '—';
  }
  $('sCode').textContent = st.code || t('codeNotSet');
  // "xdrip" (firmware 0.3+): xDrip+ really collects; "phone" also counts this page's link
  $('sPhone').textContent = t((st.xdrip !== undefined ? st.xdrip : st.phone) ? 'phoneOn' : 'phoneOff');

  const search = $('search');
  if (st.search) {
    search.hidden = false;
    search.textContent = t('searching', st.code, Math.ceil(st.left / 60));
  } else {
    search.hidden = true;
  }

  // Firmware 0.3.1+ leaves out "use"/"tried" when 0
  const list = (st.seen || []).slice().sort((a, b) => (b.use | 0) - (a.use | 0) || b.rssi - a.rssi);
  $('seen').innerHTML = list.length ? list.map((s) => {
    const pill = s.use ? '<span class="pill good">' + t('pillUsed') + '</span>'
      : s.tried ? '<span class="pill">' + t('pillNoFit') + '</span>'
      : st.search ? '<span class="pill warn">' + t('pillCheck') + '</span>' : '<span class="pill">' + t('pillOther') + '</span>';
    return '<li><span><span class="name">' + esc(s.n) + '</span>' + bars(s.rssi) +
      '</span>' + pill + '<span class="sub">' + t('seenAgo', t('ago', s.ago)) + '</span></li>';
  }).join('') : '<li><span class="sub">' + t('seenNone') + '</span></li>';

  const bat = st.bat;
  const batt = $('batt');
  batt.hidden = !bat;
  if (bat) {
    const pct = Math.max(0, Math.min(100, bat.pct));
    $('battFill').style.width = pct + '%';
    // Red up to 20 %, yellow up to 30 %, green above.
    $('battFill').style.background = pct <= 20 ? 'var(--low)' : pct <= 30 ? 'var(--high)' : 'var(--ok)';
    $('battTxt').innerHTML = bat.usb ? BOLT : pct + '%';
    const label = t(bat.usb ? 'batCharging' : 'batDesc', pct);
    batt.setAttribute('aria-label', label);
    batt.title = label;
  }

  $('pRssi').innerHTML = st.prssi !== undefined ? rssiText(st.prssi) : '—';
  $('sRssi').innerHTML = using ? rssiText(using.rssi) + ' <span class="sub">(' + t('seenAgo', t('ago', using.ago)) + ')</span>' : '—';

  if (st.fw && st.fw !== fwVersion) {
    fwVersion = st.fw;
    renderVersion();
  }

  const cs = $('certsState');
  if (!certsChr || !st.certs) {
    cs.innerHTML = '<span class="pill warn">' + t('certsOld') + '</span>';
  } else if (st.certs === 'none') {
    cs.innerHTML = '<span class="pill bad">' + t('certsNone') + '</span>';
    $('certsBox').open = true;
  } else {
    cs.innerHTML = '<span class="pill good">' + t(st.certs === 'stored' ? 'certsStored' : 'certsBuiltin') + '</span>';
  }

  // The bridge keeps its last answer across connections: show it only after our own command.
  if (awaitingAnswer && st.msg && st.msg !== 'ready') $('bridgeMsg').textContent = 'Bridge: ' + st.msg;
}

const BOLT = '<svg viewBox="0 0 10 16" aria-hidden="true"><path d="M6.2 0 0.5 9.3h4L3.5 16l6-9.6h-4z"/></svg>';

const G7_SESSION_MIN = 15120; // 10 days + 12 h grace

function rssiText(r) {
  const [label, cls] = r >= -70 ? [t('rssiGood'), 'good'] : r >= -85 ? [t('rssiMid'), 'warn'] : [t('rssiBad'), 'bad'];
  return '<span style="font-variant-numeric:tabular-nums">' + r + ' dBm</span>' + bars(r) +
    ' <span class="pill ' + cls + '">' + label + '</span>';
}

async function readStatus() {
  if (!statusChr || busy) return;
  busy = true;
  try {
    const v = await statusChr.readValue();
    render(JSON.parse(new TextDecoder().decode(v)));
  } catch (e) {
    $('msg').textContent = t('readFail') + e.message;
  } finally {
    busy = false;
  }
}

let awaitingAnswer = false;

async function send(cmd) {
  if (!cmdChr) return;
  awaitingAnswer = true;
  try {
    await cmdChr.writeValueWithResponse(new TextEncoder().encode(cmd));
    setTimeout(readStatus, 600);
  } catch (e) {
    $('bridgeMsg').textContent = t('sendFail') + e.message;
  }
}

function setConnected(on) {
  $('dot').classList.toggle('on', on);
  $('connText').textContent = t(on ? 'connYes' : 'connNo');
  $('connectBtn').textContent = t(on ? 'disconnectBtn' : 'connectBtn');
  $('unpairBtn').disabled = !on;
  $('certsBtn').disabled = !(on && certsChr);
  validateCode();
  if (timer) clearInterval(timer);
  timer = on ? setInterval(readStatus, 5000) : null;
}

// Reconnect by itself while the page is open, unless the user pressed "Disconnect".
let wantConnected = false, reconnectTimer = null;

function scheduleReconnect() {
  if (reconnectTimer || !wantConnected || !device) return;
  reconnectTimer = setTimeout(async () => {
    reconnectTimer = null;
    if (!wantConnected || (device && device.gatt.connected)) return;
    $('msg').textContent = t('reconnecting');
    await openGatt();
  }, 4000);
}

function onDisconnected() {
  statusChr = cmdChr = certsChr = null;
  setConnected(false);
  $('msg').textContent = t(wantConnected ? 'discRetry' : 'disc');
  scheduleReconnect();
}

function adopt(d) {
  if (device === d) return;
  device = d;
  device.addEventListener('gattserverdisconnected', onDisconnected);
}

async function connect() {
  if (device && device.gatt.connected) {
    wantConnected = false;
    device.gatt.disconnect();
    return;
  }
  try {
    $('msg').textContent = t('pick');
    adopt(await navigator.bluetooth.requestDevice({ filters: [{ name: 'G7 Bridge' }], optionalServices: [SVC, 'device_information'] }));
    wantConnected = true;
    await openGatt();
  } catch (e) {
    $('msg').textContent = e.name === 'NotFoundError' ? t('noDevice') : t('connFail') + e.message;
  }
}

// A bridge this browser was already allowed to use: connect without the chooser.
async function autoConnect() {
  if (!navigator.bluetooth) return;
  if (!navigator.bluetooth.getDevices) {
    $('autoHelp').open = true; // flag not enabled yet: show how
    return;
  }
  try {
    const known = (await navigator.bluetooth.getDevices()).filter((d) => d.name === 'G7 Bridge');
    if (!known.length) return;
    adopt(known[0]);
    wantConnected = true;
    $('msg').textContent = t('remembered');
    await openGatt();
  } catch (e) {
    /* no remembered permission: the button stays */
  }
}

async function openGatt() {
  try {
    const server = await device.gatt.connect();
    const svc = await server.getPrimaryService(SVC);
    statusChr = await svc.getCharacteristic(STATUS);
    cmdChr = await svc.getCharacteristic(CMD);
    certsChr = await svc.getCharacteristic(CERTS).catch(() => null); // older firmware: none
    // Device Information: needs the permission asked for in connect(); older grants lack it.
    try {
      const dis = await server.getPrimaryService('device_information');
      const v = await (await dis.getCharacteristic('firmware_revision_string')).readValue();
      fwVersion = new TextDecoder().decode(v).trim();
    } catch (e) { /* the status JSON may still carry "fw" */ }
    renderVersion();
    setConnected(true);
    $('msg').textContent = ''; // the dot and "Connected" in the header say it
    await readStatus();
  } catch (e) {
    if (e.name === 'SecurityError' || /insufficient|authentic|encrypt/i.test(e.message)) {
      $('msg').textContent = t('denied');
      wantConnected = false;
    } else {
      $('msg').textContent = t('noConn', e.message);
    }
    setConnected(false);
    scheduleReconnect();
  }
}

function validateCode() {
  const ok = /^(\d{4}|\d{6})$/.test($('code').value);
  $('pairBtn').disabled = !(ok && cmdChr);
}

$('code').addEventListener('input', validateCode);
$('pairForm').addEventListener('submit', (e) => {
  e.preventDefault();
  const code = $('code').value;
  if (!/^(\d{4}|\d{6})$/.test(code)) return;
  $('bridgeMsg').textContent = t('sendingCode', code);
  send('code ' + code);
});
$('connectBtn').addEventListener('click', connect);
$('unpairBtn').addEventListener('click', () => { $('unpairConfirm').hidden = false; });
$('unpairNo').addEventListener('click', () => { $('unpairConfirm').hidden = true; });
$('unpairYes').addEventListener('click', () => {
  $('unpairConfirm').hidden = true;
  $('bridgeMsg').textContent = t('unpairing');
  send('unpair_phone');
});

applyLang();
if (!('bluetooth' in navigator)) {
  $('noBt').hidden = false;
  $('connectBtn').disabled = true;
} else {
  autoConnect();
}
</script>
</body>
</html>
