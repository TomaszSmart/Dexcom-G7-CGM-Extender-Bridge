# BLE central role: scan for the Dexcom G7 transmitter and connect to it.
CONFIG_BT=y
CONFIG_BT_CENTRAL=y
# Active scanning otherwise uses a fresh random address, and the controller then
# refuses to switch back to ours for advertising to the phone while it scans.
CONFIG_BT_SCAN_WITH_IDENTITY=y
CONFIG_BT_GATT_CLIENT=y
CONFIG_BT_GATT_DM=y

# BLE peripheral role at the same time: standard CGM service (0x181F) for
# xDrip+'s GluPro collector (src/g7_cgms.c). One link to the G7, one to the phone;
# bonds for the sensor and the phone (plus one spare for a sensor change).
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="G7 Bridge"
CONFIG_BT_MAX_CONN=2
CONFIG_BT_MAX_PAIRED=4
CONFIG_BT_DIS=y
# Maximum radio power of the nRF52840 (+8 dBm, default 0) for every role: the
# phone may be a room or two away while the bridge sits in a pocket by the sensor.
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
# HCI Read RSSI (range test on the phone page); off by default in the SoftDevice Controller.
CONFIG_BT_CTLR_CONN_RSSI=y
CONFIG_BT_DIS_MODEL="G7 Bridge"
CONFIG_BT_DIS_MANUF="DIY"
# xDrip+ GluPro puts every one of these into a ConcurrentHashMap straight from
# getCharacteristic(); a missing one is a null value and crashes xDrip+. Keep all
# six (manufacturer, model, serial, firmware, hardware, system ID) present.
CONFIG_BT_DIS_SERIAL_NUMBER=y
CONFIG_BT_DIS_SERIAL_NUMBER_STR="0001"
CONFIG_BT_DIS_FW_REV=y
CONFIG_BT_DIS_FW_REV_STR="0.2-dev"
CONFIG_BT_DIS_HW_REV=y
CONFIG_BT_DIS_HW_REV_STR="XIAO nRF52840"
CONFIG_BT_DIS_SYSTEM_ID=y

# BLE-level bonding with the G7 is plain "Just Works"; the pairing code is used
# by an app-layer EC-JPAKE on top of GATT instead -- see PROTOCOL_RESEARCH.md 2a.
CONFIG_BT_SMP=y
# Let a phone that lost its bond (xDrip+ reinstalled, "forget device") pair again
# with Just Works instead of being refused with "auth requirements" until the old
# bond is deleted here by hand (`g7 unpair_phone`). Trade-off: a device spoofing
# the phone's address could replace that bond -- acceptable for a Just Works link.
CONFIG_BT_SMP_ALLOW_UNAUTH_OVERWRITE=y
# pairing_accept() in main.c: phones may only bond in the first 10 min after power-on.
CONFIG_BT_SMP_APP_PAIRING_ACCEPT=y
CONFIG_BT_BONDABLE=y

# Persist bonding info (BLE keys) across reboots so we don't have to re-pair with
# the sensor every time the board resets.
CONFIG_FLASH=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_BT_SETTINGS=y

CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_PRINTK=y

# `g7 set_id`/`get_id`/`clear_id` commands, on the same USB console as the logs.
CONFIG_SHELL=y

CONFIG_MAIN_STACK_SIZE=4096

# bt_gatt_dm (GATT discovery library) allocates its attribute cache from the heap.
CONFIG_HEAP_MEM_POOL_SIZE=4096

# EC-JPAKE (src/g7_jpake.c): P-256 point math, SHA-256 and AES-128 from TinyCrypt,
# which the Bluetooth host already pulls in. ECC_DSA also builds ecc.c and will be
# needed for the certificate-signing step later.
CONFIG_TINYCRYPT=y
CONFIG_TINYCRYPT_ECC_DSA=y
CONFIG_TINYCRYPT_SHA256=y
CONFIG_TINYCRYPT_AES=y

# `g7 jpake_selftest` runs a few seconds of P-256 math on the shell thread.
CONFIG_SHELL_STACK_SIZE=4096

# Room for bursts (a backfill or a phone's history request logs many lines at
# once). For byte-level auth debugging set g7_auth.c to LOG_LEVEL_DBG.
CONFIG_LOG_BUFFER_SIZE=8192
