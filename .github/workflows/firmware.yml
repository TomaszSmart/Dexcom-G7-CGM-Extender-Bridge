# Builds the G7 Bridge firmware. A pushed tag v* also publishes a GitHub Release
# with one .uf2 per board. The app certificates are never part of these images.
name: Firmware

on:
  push:
    branches: [main]
    paths: ['firmware/**', '.github/workflows/firmware.yml']
    tags: ['v*']
  pull_request:
    paths: ['firmware/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    container: ghcr.io/nrfconnect/sdk-nrf-toolchain:v2.9.3
    defaults:
      run:
        shell: bash   # non-interactive bash loads the toolchain (BASH_ENV in the image)
    strategy:
      fail-fast: false
      matrix:
        include:
          - board: rak4631/nrf52840
            name: rak4631
          - board: xiao_ble
            name: xiao-nrf52840
    steps:
      - uses: actions/checkout@v4
        with:
          path: app

      - name: Refuse private certificates
        run: |
          if [ -e app/firmware/src/g7_certs.h ]; then
            echo "::error::firmware/src/g7_certs.h holds a signing key and must never be committed"
            exit 1
          fi

      - name: Cache nRF Connect SDK
        uses: actions/cache@v4
        with:
          path: ncs
          key: ncs-v2.9.3

      - name: Fetch nRF Connect SDK v2.9.3
        run: |
          [ -d ncs/.west ] || west init -m https://github.com/nrfconnect/sdk-nrf --mr v2.9.3 ncs
          cd ncs
          west update --narrow -o=--depth=1

      - name: Build
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then VER="${GITHUB_REF_NAME#v}"; else VER="dev-${GITHUB_SHA::7}"; fi
          cd ncs
          west build -b ${{ matrix.board }} --pristine --no-sysbuild -d build ../app/firmware \
            -- -DCONFIG_BT_DIS_FW_REV_STR="\"$VER\""
          mkdir -p ../out
          cp build/zephyr/zephyr.uf2 "../out/g7-bridge-${{ matrix.name }}-$VER.uf2"

      - uses: actions/upload-artifact@v4
        with:
          name: g7-bridge-${{ matrix.name }}
          path: out/*.uf2

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*.uf2
          generate_release_notes: true
